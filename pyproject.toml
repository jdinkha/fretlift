[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fretlift"
version = "0.1.0"
description = "Generate guitar tabs from local audio: source separation, note transcription, beat tracking and fingering assignment."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jacob Dinkha" }]
requires-python = ">=3.10"
# The core (quantization, fretting, export) only needs numpy, so tests and CI stay light.
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# The pretrained models. Basic Pitch pins its own backends per platform; if pip
# can't resolve it on your Python version, use Python 3.11 (see README).
ml = [
    "demucs>=4.0",
    "basic-pitch>=0.3",
    "librosa>=0.10",
    "soundfile>=0.12",
    # Basic Pitch pins resampy<0.4.3, which imports pkg_resources (removed in setuptools 81).
    "setuptools<81",
]
# Training and evaluating your own model (docs/TRAINING.md). On a GPU machine,
# install the PyTorch build for your CUDA version first.
train = ["torch>=2.1", "scipy>=1.10", "soundfile>=0.12", "librosa>=0.10", "pretty_midi>=0.2.10", "gdown>=5.2"]
eval = ["mir_eval>=0.7"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
fretlift = "fretlift.cli:main"
fretlift-data = "fretlift.training.data_cli:main"
fretlift-train = "fretlift.training.train:main"
fretlift-eval = "fretlift.training.evaluate:main"
fretlift-sweep = "fretlift.training.sweep:main"
fretlift-view = "fretlift.view:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fretlift = ["viewer/index.html"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/fretlift/tuning.py"]
addopts = "--doctest-modules"

[tool.ruff]
line-length = 125
target-version = "py310"
extend-exclude = ["notebooks"]  # Colab cells are mostly `!shell` lines, which can't be wrapped

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]  # zip() without strict= is fine here
