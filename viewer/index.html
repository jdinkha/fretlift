<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fretlift viewer</title>
<!--
  Opens a tab file (MusicXML, Guitar Pro, alphaTex) and plays it back with alphaTab.
  Everything happens in your browser; the file is never uploaded anywhere.
  Run `python -m http.server` in the repo root and open http://localhost:8000/viewer/
  (browsers restrict some features on file:// pages).
-->
<script src="https://cdn.jsdelivr.net/npm/@coderline/alphatab@latest/dist/alphaTab.js"></script>
<style>
  :root {
    --bg: #faf8f5; --fg: #1d1b18; --muted: #6b665f; --line: #e3ded6;
    --panel: #ffffff; --accent: #b4532a; --accent-fg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171614; --fg: #ece8e1; --muted: #a39d93; --line: #34312c;
      --panel: #201f1c; --accent: #e07a4c; --accent-fg: #171614;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
           padding: 12px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0;
           background: var(--bg); z-index: 2; }
  h1 { font-size: 16px; margin: 0 12px 0 0; letter-spacing: .02em; }
  h1 span { color: var(--accent); }
  button, label.btn { font: inherit; border: 1px solid var(--line); background: var(--panel);
                      color: var(--fg); padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  #status { color: var(--muted); font-size: 13px; margin-left: auto; }
  input[type=file] { display: none; }
  #drop { margin: 24px 16px; padding: 48px 16px; text-align: center; color: var(--muted);
          border: 2px dashed var(--line); border-radius: 10px; }
  #drop.hover { border-color: var(--accent); color: var(--fg); }
  .viewport { padding: 0 16px 48px; overflow-x: hidden; }
  /* alphaTab draws in black; give it a light sheet in dark mode for contrast */
  #score { background: #ffffff; border-radius: 8px; }
  #score:empty { display: none; }
  .at-cursor-bar { background: rgba(180, 83, 42, .12); }
  .at-cursor-beat { background: var(--accent); width: 3px; }
  .at-highlight * { fill: var(--accent); stroke: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>tab<span>scribe</span> viewer</h1>
  <label class="btn">Open tab… <input id="file" type="file" accept=".musicxml,.xml,.mxl,.gp,.gp3,.gp4,.gp5,.gpx,.atex"></label>
  <button id="play" class="primary" disabled>Play</button>
  <button id="stop" disabled>Stop</button>
  <span id="status">No file loaded</span>
</header>
<div id="drop">Drop a <code>.musicxml</code> file from <code>fretlift</code> here, or use “Open tab…”</div>
<div class="viewport"><div id="score"></div></div>

<script>
  const $ = (id) => document.getElementById(id);
  const status = (msg) => { $("status").textContent = msg; };

  const api = new alphaTab.AlphaTabApi($("score"), {
    core: { useWorkers: false },
    display: { staveProfile: "Tab", scale: 1.0 },
    player: {
      enablePlayer: true,
      enableCursor: true,
      soundFont: "https://cdn.jsdelivr.net/npm/@coderline/alphatab@latest/dist/soundfont/sonivox.sf2",
      scrollElement: document.querySelector(".viewport"),
    },
  });

  api.scoreLoaded.on((score) => {
    $("drop").style.display = "none";
    const tempo = score.tempo ? ` · ${Math.round(score.tempo)} BPM` : "";
    status(`${score.title || "Untitled"}${tempo}`);
  });
  api.error.on((e) => status(`Couldn't open that file: ${e.message || e}`));
  api.playerReady.on(() => { $("play").disabled = false; $("stop").disabled = false; });
  api.playerStateChanged.on((e) => { $("play").textContent = e.state === 1 ? "Pause" : "Play"; });

  async function openFile(file) {
    if (!file) return;
    status(`Loading ${file.name}…`);
    api.load(new Uint8Array(await file.arrayBuffer()));
  }

  $("file").addEventListener("change", (e) => openFile(e.target.files[0]));
  $("play").addEventListener("click", () => api.playPause());
  $("stop").addEventListener("click", () => api.stop());

  const drop = $("drop");
  ["dragenter", "dragover"].forEach((t) => document.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("hover"); }));
  ["dragleave", "drop"].forEach((t) => document.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("hover"); }));
  document.addEventListener("drop", (e) => openFile(e.dataTransfer.files[0]));
</script>
</body>
</html>
